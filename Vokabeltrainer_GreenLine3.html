<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Green Line 3 Vokabeltrainer</title>
<style>
:root{--ink:#14213d;--paper:#f4f6fb;--card:#fff;--line:#d5dbea;--mute:#5b6784;--hi:#ffd23f;--hi-ink:#3a2f00;--ok:#1f8f55;--okbg:#dff5e8;--bad:#d63d3d;--badbg:#fde4e4;--sky:#2b7de9;--skybg:#e3eefc}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#e9eeff;--paper:#0f1730;--card:#18224a;--line:#2b3868;--mute:#9aa8d2;--hi-ink:#2b2300;--okbg:#12402b;--badbg:#4a1f26;--skybg:#1b2f5e;--ok:#4fd18b;--bad:#ff7b7b;--sky:#7db2ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 ui-rounded,"Nunito","Segoe UI",system-ui,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
header.top{background:#14213d;color:#fff;padding:14px 16px}
header.top .in{max-width:820px;margin:auto;display:flex;align-items:center;gap:12px;justify-content:space-between}
header.top h1{font-size:1.15rem;margin:0;font-weight:800;letter-spacing:.2px}
header.top small{opacity:.75;display:block;font-weight:500}
main{max-width:820px;margin:auto;padding:16px 16px 110px}
h2{font-size:1.5rem;margin:.6em 0 .3em}
.btn{color:var(--ink);border:2px solid var(--ink);background:var(--card);border-radius:12px;padding:10px 16px;font-weight:700;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.pri{background:var(--hi);color:var(--hi-ink)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok);box-shadow:0 3px 0 rgba(0,0,0,.3)}
.btn.bad{background:var(--bad);color:#fff;border-color:var(--bad);box-shadow:0 3px 0 rgba(0,0,0,.3)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.small{padding:6px 12px;font-size:.9rem;box-shadow:0 2px 0 var(--ink)}
.ghost{background:none;border:0;color:var(--sky);font-weight:700;padding:6px 0;text-decoration:underline}
.unit{background:var(--card);border:2px solid var(--line);border-radius:16px;margin:12px 0;overflow:hidden}
.unit>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;font-weight:800}
.unit>summary::-webkit-details-marker{display:none}
.unit>summary .t{flex:1}
.unit>summary .t small{display:block;font-weight:500;color:var(--mute)}
.unit[open]>summary{border-bottom:2px solid var(--line);background:var(--skybg)}
.chap{display:flex;gap:12px;align-items:flex-start;padding:10px 16px;border-top:1px solid var(--line)}
.chap:first-of-type{border-top:0}
.chap label{flex:1;cursor:pointer}
.chap input{width:22px;height:22px;margin-top:3px;accent-color:#2b7de9}
.chap .n{color:var(--mute);font-size:.9rem;white-space:nowrap}
.chap .st{font-size:.85rem;color:var(--ok);font-weight:700}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--ink);padding:12px 16px;z-index:5}
.bar .in{max-width:820px;margin:auto;display:flex;gap:12px;align-items:center;justify-content:space-between}
.trail{list-style:none;margin:18px 0;padding:0 0 0 26px;position:relative}
.trail:before{content:"";position:absolute;left:25px;top:20px;bottom:20px;border-left:4px dotted var(--line)}
.trail li{position:relative;margin:14px 0}
.node{position:absolute;left:-26px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:var(--card);border:3px solid var(--ink);display:grid;place-items:center;font-weight:800;z-index:1}
.lv{margin-left:34px;display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:12px 14px;width:calc(100% - 34px);text-align:left}
.lv.done .node,.done .node{background:var(--ok);color:#fff;border-color:var(--ok)}
.lv.locked{opacity:.55;border-style:dashed;cursor:not-allowed}
.lv b{display:block}.lv span{color:var(--mute);font-size:.92rem}
.lvwrap.next .lv{background:var(--hi);color:var(--hi-ink)}
.lvwrap.next .lv span{color:var(--hi-ink)}
.card{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:18px;box-shadow:0 5px 0 var(--ink)}
.instr{background:var(--skybg);border-left:6px solid var(--sky);border-radius:10px;padding:12px 14px;margin:10px 0 14px}
.instr .de{margin-top:8px;padding-top:8px;border-top:1px dashed var(--sky);color:var(--mute)}
.prog{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.prog i{display:block;height:100%;background:var(--ok);transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:.9rem}
.big{font-size:2rem;font-weight:800;text-align:center;margin:18px 0 6px;overflow-wrap:anywhere}
.flip{text-align:center;min-height:190px;display:flex;flex-direction:column;justify-content:center}
.de-big{font-size:1.45rem;font-weight:700;color:var(--sky);margin:8px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px 10px;text-align:center;font-weight:700;min-height:56px;overflow-wrap:anywhere}
.m.sel{border-color:var(--sky);background:var(--skybg)}
.m.done{border-color:var(--ok);background:var(--okbg);color:var(--ok);opacity:.8}
.m.wrong{border-color:var(--bad);background:var(--badbg);animation:sh .35s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sent{font-size:1.3rem;line-height:2.1;margin:12px 0}
.gap{border:0;border-bottom:3px solid var(--ink);background:var(--hi);border-radius:6px 6px 0 0;padding:2px 6px;text-align:center;min-width:3ch;font-weight:700}
.gap.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.gap.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.pat{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em;background:var(--skybg);border-radius:8px;padding:4px 10px;display:inline-block;font-weight:700}
.fb{margin-top:12px;padding:10px 14px;border-radius:10px;font-weight:700}
.fb.ok{background:var(--okbg);color:var(--ok)}.fb.bad{background:var(--badbg);color:var(--bad)}
.tip{margin-top:10px;color:var(--mute)}
.text{font-size:1.15rem;line-height:2.2}
.text .gap{font-size:1.05rem}
.end{text-align:center;padding:22px 10px}
.end .big{font-size:2.4rem}
.chip{display:inline-block;background:var(--hi);color:var(--hi-ink);border-radius:99px;padding:2px 10px;font-weight:800;font-size:.85rem}
.sel-sum{color:var(--mute)}
</style>
</head>

function save(){try{localStorage.setItem('gl3vocab',JSON.stringify(store))}catch(e){}}
// flat data
const CH={};const ALL=[];
DATA.vocab.forEach(u=>u.chapters.forEach(c=>{
  c.unit=u;c.items=c.words.map((w,i)=>({id:c.id+':'+i,ch:c.id,en:w[0],de:w[1],short:w[1].split(';')[0].trim(),sent:null}));
  const cc=DATA.content[c.id]||{sent:{},texts:[]};
  c.items.forEach(it=>it.sent=cc.sent[it.en]||null);c.texts=cc.texts;CH[c.id]=c;ALL.push(...c.items);
}));
let sel=new Set(),view='home',key='',items=[],texts=[];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function selItems(){return [...sel].sort().flatMap(id=>CH[id].items)}
function chapterOrder(){return DATA.vocab.flatMap(u=>u.chapters.map(c=>c.id))}
function doneLevels(k){return store[k]||0}
function speak(t){try{const u=new SpeechSynthesisUtterance(t.replace(/\(.*?\)/g,'').replace(/\b(sb|sth)\b/g,'somebody'));u.lang='en-GB';u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function instr(l){return `<div class="instr"><div>${esc(l.en)}</div><button class="ghost" id="deBtn" aria-expanded="false">Auf Deutsch anzeigen</button><div class="de" id="deTxt" hidden>${esc(l.de)}</div></div>`}
function bindInstr(){const b=$('#deBtn');if(!b)return;b.onclick=()=>{const t=$('#deTxt');t.hidden=!t.hidden;b.setAttribute('aria-expanded',!t.hidden);b.textContent=t.hidden?'Auf Deutsch anzeigen':'Deutsch ausblenden'}}
/* ---------- HOME ---------- */
function home(){
  view='home';$('#homeBtn').hidden=true;
  let h=`<h2>Was möchtest du üben?</h2><p class="sel-sum">Wähle ein oder mehrere Kapitel aus dem Vocabulary. Du kannst auch ganze Units auswählen. Insgesamt gibt es ${ALL.length} Vokabeln.</p>`;
  DATA.vocab.forEach(u=>{
    const ids=u.chapters.map(c=>c.id),n=u.chapters.reduce((a,c)=>a+c.items.length,0);
    const open=u.chapters.some(c=>sel.has(c.id))?'open':'';
    h+=`<details class="unit" ${open} data-u="${u.id}"><summary><input type="checkbox" class="uchk" aria-label="Ganze Einheit auswählen: ${esc(u.name)}" ${ids.every(i=>sel.has(i))?'checked':''}><span class="t">${esc(u.name)}: ${esc(u.topic)}<small>${u.chapters.length>1?u.chapters.length+' Kapitel':'1 Kapitel'} · ${n} Vokabeln</small></span></summary>`;
    u.chapters.forEach(c=>{
      const dl=doneLevels(c.id);
      h+=`<div class="chap"><input type="checkbox" id="c_${c.id}" data-c="${c.id}" ${sel.has(c.id)?'checked':''}><label for="c_${c.id}">${esc(c.title)}${dl?`<div class="st">Level ${dl} von 5 geschafft</div>`:''}</label><span class="n">${c.items.length} Wörter</span></div>`;
    });
    h+=`</details>`;
  });
  h+=`<div class="bar"><div class="in"><span id="selSum" class="sel-sum"></span><button class="btn pri" id="go">Weiter</button></div></div>`;
  app.innerHTML=h;
  const upd=()=>{const n=selItems().length;$('#selSum').textContent=sel.size?`${sel.size} Kapitel · ${n} Vokabeln`:'Noch nichts ausgewählt';$('#go').disabled=!sel.size};
  app.querySelectorAll('[data-c]').forEach(cb=>cb.onchange=()=>{cb.checked?sel.add(cb.dataset.c):sel.delete(cb.dataset.c);syncU();upd()});
  function syncU(){app.querySelectorAll('.unit').forEach(d=>{const u=DATA.vocab.find(x=>x.id===d.dataset.u);d.querySelector('.uchk').checked=u.chapters.every(c=>sel.has(c.id))})}
  app.querySelectorAll('.uchk').forEach(cb=>{cb.onclick=e=>e.stopPropagation();cb.onchange=()=>{const u=DATA.vocab.find(x=>x.id===cb.closest('.unit').dataset.u);u.chapters.forEach(c=>{cb.checked?sel.add(c.id):sel.delete(c.id);const el=document.getElementById('c_'+c.id);if(el)el.checked=cb.checked});upd()}});
  $('#go').onclick=()=>{key=[...sel].sort().join(',');trail()};
  upd();
}
/* ---------- TRAIL ---------- */
function trail(){
  view='trail';$('#homeBtn').hidden=false;
  items=selItems();const d=doneLevels(key);
  const names=chapterOrder().filter(id=>sel.has(id)).map(id=>CH[id]);
  let h=`<h2>Deine Level</h2><p class="sel-sum">${items.length} Vokabeln aus: ${names.map(c=>esc(c.unit.name==='Unit 1'||/^Unit/.test(c.unit.name)?c.unit.name+' – '+c.title.split(':')[0]:c.title.split(':')[0])).join('; ')}</p><p>Spiele die Level nacheinander. Das nächste Level öffnet sich, wenn du das vorige geschafft hast.</p><ol class="trail">`;
  LEVELS.forEach(l=>{
    const done=d>=l.n,locked=l.n>d+1,next=l.n===d+1;
    h+=`<li class="lvwrap ${next?'next':''} ${done?'done':''}"><span class="node">${done?'✓':locked?'🔒':l.n}</span><button class="lv ${locked?'locked':''}" data-l="${l.n}" ${locked?'aria-disabled="true"':''}><div><b>Level ${l.n}: ${l.name}</b><span>${locked?'Zuerst Level '+(l.n-1)+' schaffen':l.sub}</span></div></button></li>`;
  });
  h+=`</ol><button class="ghost" id="reset">Fortschritt für diese Auswahl zurücksetzen</button>`;
  app.innerHTML=h;
  app.querySelectorAll('.lv').forEach(b=>b.onclick=()=>{const n=+b.dataset.l;if(n>d+1)return;play(n)});
  $('#reset').onclick=()=>{delete store[key];save();trail()};
}
$('#homeBtn').onclick=home;
function finish(n,mistakes,total){
  if(doneLevels(key)<n){store[key]=n;save()}
  const msg=mistakes===0?'Perfekt, kein Fehler!':`${mistakes} Fehler gemacht und wiederholt. Gut gemacht!`;
  app.innerHTML=`<div class="card end"><div class="big">Level ${n} geschafft! 🎉</div><p>${msg}</p><div class="row">${n<5?`<button class="btn pri" id="nx">Weiter zu Level ${n+1}</button>`:''}<button class="btn" id="bk">Zurück zur Übersicht</button><button class="btn" id="rp">Level nochmal spielen</button></div></div>`;
  if($('#nx'))$('#nx').onclick=()=>play(n+1);$('#bk').onclick=trail;$('#rp').onclick=()=>play(n);
}
function head(l,done,total,extra=''){return `<button class="ghost" id="back">← Zur Übersicht</button><h2>Level ${l.n}: ${l.name}</h2>${instr(l)}<div class="prog"><i style="width:${total?Math.round(done/total*100):0}%"></i></div><div class="meta"><span>${done} von ${total} geschafft</span><span>${extra}</span></div>`}
function play(n){const l=LEVELS[n-1];[null,L1,L2,L3,L4,L5][n](l)}
/* ---------- LEVEL 1 ---------- */
function L1(l){
  let q=shuffle(items),total=q.length,done=0,mist=0,flipped=false;
  function draw(){
    if(!q.length)return finish(1,mist,total);
    const it=q[0];
    app.innerHTML=head(l,done,total)+`<div class="card flip" id="fc"><div class="big">${esc(it.en)}</div><div><button class="btn small" id="spk" aria-label="Aussprechen">🔊 Anhören</button></div>${flipped?`<div class="de-big">${esc(it.de)}</div>`:`<p class="tip">Tippe auf die Karte oder den Button.</p>`}</div><div class="row">${flipped?`<button class="btn bad" id="ag">Again</button><button class="btn ok" id="kn">I knew it</button>`:`<button class="btn pri" id="sh">Deutsch zeigen</button>`}</div>`;
    bindInstr();$('#back').onclick=trail;$('#spk').onclick=e=>{e.stopPropagation();speak(it.en)};
    const fl=()=>{flipped=true;draw()};
    $('#fc').onclick=()=>{if(!flipped)fl()};
    if(!flipped){$('#sh').onclick=fl}else{
      $('#kn').onclick=()=>{q.shift();done++;flipped=false;draw()};
      $('#ag').onclick=()=>{mist++;q.shift();q.splice(Math.min(4,q.length),0,it);flipped=false;draw()};
    }
  }
  draw();
}
/* ---------- LEVEL 2/3 matching ---------- */
function L2(l){match(l,2)}function L3(l){match(l,3)}
function match(l,n){
  let q=shuffle(items),total=items.length,done=0,mist=0;
  function round(){
    if(!q.length)return finish(n,mist,total);
    const r=[],seenE=new Set(),seenD=new Set();
    for(let i=0;i<q.length&&r.length<6;i++){const it=q[i];if(seenE.has(it.en)||seenD.has(it.short))continue;seenE.add(it.en);seenD.add(it.short);r.push(it)}
    q=q.filter(x=>!r.includes(x));
    const missed=new Set();let left=r.length,a=null;
    const L=n===2?shuffle(r):shuffle(r),R=shuffle(r);
    const lt=it=>n===2?it.en:it.short,rt=it=>n===2?it.short:it.en;
    app.innerHTML=head(l,done,total,'Tippe links und rechts')+`<div class="match" id="mt"><div style="display:grid;gap:10px">${L.map(it=>`<button class="m" data-s="L" data-i="${it.id}">${esc(lt(it))}</button>`).join('')}</div><div style="display:grid;gap:10px">${R.map(it=>`<button class="m" data-s="R" data-i="${it.id}">${esc(rt(it))}</button>`).join('')}</div></div><div class="fb" id="fb" hidden role="status"></div>`;
    bindInstr();$('#back').onclick=trail;
    const btns=[...app.querySelectorAll('.m')];
    btns.forEach(b=>b.onclick=()=>{
      if(b.classList.contains('done'))return;
      if(!a||a.dataset.s===b.dataset.s){btns.filter(x=>x.dataset.s===b.dataset.s).forEach(x=>x.classList.remove('sel'));b.classList.add('sel');a=b;return}
      const ok=a.dataset.i===b.dataset.i;
      if(ok){[a,b].forEach(x=>{x.classList.remove('sel');x.classList.add('done')});done++;left--;a=null;
        if(!left){const fb=$('#fb');fb.hidden=false;fb.className='fb ok';fb.textContent='Alles richtig zugeordnet!'; const miss=r.filter(x=>missed.has(x.id));miss.forEach(x=>q.splice(Math.min(3,q.length),0,x));
          done-=miss.length;
          const row=document.createElement('div');row.className='row';row.innerHTML=`<button class="btn pri" id="nr">${q.length?'Nächste Runde':'Fertig'}</button>`;fb.after(row);$('#nr').onclick=round;}
      }else{
        const idL=a.dataset.s==='L'?a:b,idR=a.dataset.s==='R'?a:b;
        missed.add(a.dataset.i);missed.add(b.dataset.i);mist++;
        [a,b].forEach(x=>{x.classList.remove('sel');x.classList.add('wrong')});const aa=a,bb=b;
        setTimeout(()=>{aa.classList.remove('wrong');bb.classList.remove('wrong')},500);a=null;
      }
    });
  }
  round();
}
/* ---------- gaps ---------- */
function norm(s){return s.toLowerCase().replace(/[’‘`´]/g,"'").replace(/\bdo not\b/g,"don't").replace(/\bcannot\b/g,"can't").replace(/[.!?,;]+$/,'').replace(/\s+/g,' ').trim()}
function okAns(inp,ans){const v=norm(inp);return ans.split('|').some(a=>norm(a)===v)}
function pattern(ans){const a=ans.split('|')[0];return a.split(' ').map(w=>[...w].map((c,i)=>i===0||!/[A-Za-z]/.test(c)?c:'_').join(' ')).join('   ')}
function firstLetters(ans){return ans.split('|')[0].split(' ').map(w=>w[0]).join(' ')}
/* ---------- LEVEL 4 ---------- */
function L4(l){
  let q=shuffle(items.filter(i=>i.sent)),total=q.length,done=0,mist=0;
  function draw(){
    if(!q.length)return finish(4,mist,total);
    const it=q[0],m=it.sent.match(/^(.*?)\{([^}]*)\}(.*)$/),ans=m[2];
    app.innerHTML=head(l,done,total)+`<div class="card"><div class="sent">${esc(m[1])}<input class="gap" id="in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Fehlendes Wort" size="${Math.max(6,ans.length+1)}">${esc(m[3])}</div><div>Hinweis: <span class="pat">${esc(pattern(ans))}</span></div><div class="tip"><button class="ghost" id="tp">💡 Tipp: deutsche Bedeutung zeigen</button><span id="tpt" hidden></span></div><div id="fb" role="status"></div><div class="row"><button class="btn pri" id="ck">Prüfen</button></div></div>`;
    bindInstr();$('#back').onclick=trail;const inp=$('#in');inp.focus();
    $('#tp').onclick=()=>{$('#tpt').hidden=false;$('#tpt').textContent=' '+it.de;$('#tp').hidden=true};
    let checked=false;
    const check=()=>{
      if(checked){q.shift();draw();return}
      const v=inp.value;if(!v.trim()){inp.focus();return}
      checked=true;inp.readOnly=true;const fb=$('#fb');
      if(okAns(v,ans)){inp.classList.add('ok');fb.innerHTML='<div class="fb ok">Richtig! ✓</div>';done++;q[0]=null;q.shift()}
      else{inp.classList.add('bad');mist++;fb.innerHTML=`<div class="fb bad">Nicht ganz. Richtig ist: ${esc(ans.split('|')[0])}<br><small>Du siehst das Wort später noch einmal.</small></div>`;const x=q.shift();q.splice(Math.min(3,q.length),0,x);checked=true;
        $('#ck').textContent='Weiter';return $('#ck').onclick=()=>{draw()}}
      $('#ck').textContent='Weiter';$('#ck').onclick=()=>draw();
    };
    $('#ck').onclick=check;inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();check()}};
  }
  draw();
}
/* ---------- LEVEL 5 ---------- */
function L5(l){
  const T=[...sel].sort((a,b)=>chapterOrder().indexOf(a)-chapterOrder().indexOf(b)).flatMap(id=>CH[id].texts);
  let idx=0,mist=0;const total=T.length;
  function draw(){
    if(idx>=total)return finish(5,mist,total);
    const t=T[idx];let gi=0;const gaps=[];
    const html=esc(t.text).replace(/\{([^}]*)\}/g,(m,a)=>{gaps.push(a.replace(/&amp;/g,'&').replace(/&quot;/g,'"'));const i=gi++;return `<input class="gap" data-g="${i}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Lücke ${i+1}" size="${Math.max(5,gaps[i].split('|')[0].length+1)}">`});
    let hints=false;
    app.innerHTML=head(l,idx,total,'Text '+(idx+1)+' von '+total)+`<div class="card"><h3 style="margin-top:0">${esc(t.title)}</h3><div class="text" id="tx">${html}</div><div id="fb" role="status"></div><div class="row"><button class="btn" id="hn">Anfangsbuchstaben zeigen</button><button class="btn pri" id="ck">Prüfen</button></div></div>`;
    bindInstr();$('#back').onclick=trail;
    const ins=[...app.querySelectorAll('.gap')];ins[0]&&ins[0].focus();
    $('#hn').onclick=()=>{hints=!hints;ins.forEach((x,i)=>{if(!x.readOnly)x.placeholder=hints?firstLetters(gaps[i]):''});$('#hn').textContent=hints?'Anfangsbuchstaben ausblenden':'Anfangsbuchstaben zeigen'};
    ins.forEach((x,i)=>x.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();(ins[i+1]&&!ins[i+1].readOnly)?ins[i+1].focus():$('#ck').click()}});
    let allOk=false;
    $('#ck').onclick=()=>{
      if(allOk){idx++;draw();return}
      let bad=0,empty=0;
      ins.forEach((x,i)=>{if(x.readOnly)return;
        if(!x.value.trim()){empty++;x.classList.add('bad');return}
        if(okAns(x.value,gaps[i])){x.classList.remove('bad');x.classList.add('ok');x.readOnly=true}
        else{bad++;mist++;x.classList.add('bad');x.value='';x.placeholder=firstLetters(gaps[i])}});
      const fb=$('#fb');
      if(!bad&&!empty){allOk=true;fb.innerHTML='<div class="fb ok">Alles richtig! ✓</div>';$('#ck').textContent=idx+1<total?'Nächster Text':'Fertig'}
      else fb.innerHTML=`<div class="fb bad">${bad?bad+' Wort'+(bad>1?'e sind':' ist')+' falsch. Schreibe '+(bad>1?'sie':'es')+' noch einmal. Der Anfangsbuchstabe steht jetzt in der Lücke.':''} ${empty?'Fülle alle Lücken aus.':''}</div>`;
      const f=ins.find(x=>!x.readOnly);if(f)f.focus();
    };
  }
  draw();
}
home();
</script>
